repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # 与 pyproject.toml [project.optional-dependencies].dev 的 ruff==0.17.4 对齐（W12-13）
    rev: v0.17.4
    hooks:
      - id: ruff
        args: [--select, E9,F63,F7,F82]
        files: ^(pipeline|backend|scripts|tests)/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(frontend/dist|data)/
      - id: trailing-whitespace
        exclude: ^(frontend/dist|data)/
