name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify dependency pins
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = [line.strip() for line in Path("requirements.txt").read_text(encoding="utf-8").splitlines()]
          pins = [line for line in lines if line and not line.startswith("#")]
          unpinned = [line for line in pins if "==" not in line]
          if unpinned:
              raise SystemExit(f"requirements.txt has unpinned entries: {unpinned}")
          print(f"{len(pins)} pinned requirements")
          PY
      - name: Lint (ruff, pyproject config)
        run: ruff check .
      # 全量测试自包含：tests/conftest.py 将 socket 连接替换为报错并指向临时 data 目录，
      # 因此 CI 不需要真实行情库、也不会联网。
      - name: Tests (full suite)
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # frontend/package.json engines: >=22.18.0（--experimental-strip-types 需要 >=22.6）
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Verify node version satisfies engines
        working-directory: frontend
        run: |
          node --version
          node -e "const [maj,min]=process.versions.node.split('.').map(Number); if (maj<22 || (maj===22 && min<18)) { console.error('node >=22.18.0 required'); process.exit(1); }"
      - name: Typecheck (tsc --noEmit)
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests (node --test tests/*.test.mjs)
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
